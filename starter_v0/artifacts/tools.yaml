# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng khi thiếu thông tin bắt buộc, giá trị enum không rõ, hoặc cần xác nhận trước action ghi dữ liệu. Dùng yes_no cho xác nhận tạo ticket; dùng choice khi chỉ có vài lựa chọn hợp lệ. Khi cần xác nhận ticket, chỉ gọi clarify, không gọi create_ticket cùng lượt."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn, nêu đúng thông tin cần bổ sung hoặc payload cần xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text cho ID/thông tin mở; yes_no cho xác nhận; choice cho enum hữu hạn"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn hợp lệ khi response_type=choice"}
      required: [question]

  - name: search_kb
    description: "Tìm bài hướng dẫn/how-to trong knowledge base IT nội bộ, ví dụ VPN, Outlook/email, Wi-Fi, printing, account, security, hardware, software, meeting room. Không dùng cho trạng thái dịch vụ, policy công ty, hoặc kiểm tra asset cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa/hội chứng cần tìm, giữ thuật ngữ người dùng nêu"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn; dùng vpn cho VPN/macOS/Windows VPN, wifi cho Wi-Fi, email cho Outlook; chọn all nếu không phân loại chắc chắn"}
        top_k: {type: integer, minimum: 1, maximum: 5, default: 3, description: "Số kết quả cần lấy"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái shared service theo môi trường production hoặc staging, ví dụ VPN/email/SSO/Wi-Fi/printing production. Chỉ dùng khi environment là production/staging hoặc không được nêu; nếu người dùng nêu demo, QA, test hoặc môi trường không thuộc enum thì dùng clarify choice thay vì tự đổi sang staging/production. Không dùng để chẩn đoán laptop/asset riêng lẻ."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên shared service cần kiểm tra"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Chỉ production hoặc staging; demo/QA/test không hợp lệ và phải hỏi clarify choice với options production, staging"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra inventory và diagnostic snapshot cho một asset cụ thể có asset ID như LT-204, DT-031, MB-002, PR-404 hoặc RM-101. Thiếu asset ID thì hỏi clarify; không dùng cho employee ID dạng EMP-####."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản dạng LT-####, DT-####, MB-####, PR-#### hoặc RM-####; không truyền employee ID dạng EMP-####"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm diagnostic; dùng vpn cho lỗi VPN/certificate VPN, network cho Wi-Fi/kết nối, security cho bảo mật, hardware cho phần cứng, all chỉ khi người dùng yêu cầu tổng thể"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu hồ sơ nhân viên trong danh bạ hỗ trợ bằng employee ID như EMP-1003. Dùng khi cần thông tin tài khoản, người dùng hoặc thiết bị được cấp cho nhân viên. Không dùng cho asset ID như LT-204; thiếu employee ID thì hỏi clarify."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên dạng EMP-####, ví dụ EMP-1003"}
      required: [employee_id]

  - name: format_incident_report
    description: "Định dạng các finding đã có thành incident report. Dùng khi người dùng cung cấp findings hoặc sau khi đã thu thập đủ evidence; không tự gọi tool thu thập lại nếu người dùng nói chỉ format/không kiểm tra lại."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string, description: "Tên finding hoặc nguồn evidence"}
              detail: {type: string, description: "Nội dung finding"}
              source: {type: string, description: "Nguồn dữ liệu nếu có"}
              status: {type: string, description: "Trạng thái nếu có"}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo: brief ngắn, technical có chẩn đoán, handoff để bàn giao"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề báo cáo"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về manufacturer/model thiết bị trên web qua Tavily, ví dụ driver/specs/support chính hãng cho Lenovo ThinkPad T14 Gen 4. Chỉ truyền hãng, model công khai, query_type và max_results; tuyệt đối không truyền asset ID, employee ID, serial, hostname, location, diagnostics, ticket content hoặc credential."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo, Dell hoặc HP"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4; không kèm asset ID nội bộ"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm: specs, drivers, support hoặc compatibility"}
        max_results: {type: integer, minimum: 1, maximum: 5, default: 3, description: "Số kết quả Tavily cần lấy, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ khi người dùng hỏi theo policy/quy định/có được phép không, ví dụ MFA, password/token trong transcript, external tools, incident priority, ticket confirmation hoặc service change. Không dùng cho how-to kỹ thuật thông thường."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Câu hỏi policy cần tra cứu, giữ các thuật ngữ như MFA, token, ticket, incident, external tool"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách phù hợp; chọn all nếu không chắc"}
        top_k: {type: integer, minimum: 1, maximum: 5, default: 3, description: "Số mục policy cần lấy"}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket hỗ trợ local, có side effect ghi file. Chỉ gọi khi người dùng đã xác nhận rõ ràng payload cuối cùng. Nếu mới yêu cầu tạo/chỉnh ticket, muốn xem lại payload, muốn được hỏi xác nhận, hoặc xác nhận cũ bị thay đổi bởi summary/asset/priority mới thì không gọi tool này; gọi clarify yes_no. Không bao giờ dùng create_ticket như dry-run. Không đưa password, token, API key, MFA/OTP hoặc recovery code vào summary."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố đã được xác nhận, không chứa secrets/credentials"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên đã xác nhận"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có, dạng LT-####/DT-####/MB-####/PR-####/RM-####"}
        confirmed: {type: boolean, enum: [true], description: "Bắt buộc là true; nếu chưa thể đặt true thì không gọi create_ticket"}
      required: [summary, confirmed]
